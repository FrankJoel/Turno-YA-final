<!DOCTYPE html>
<html class="h-full" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>TurnoYa - Display TV</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "secondary":"#4a607c","outline":"#717782",
                        "secondary-container":"#c5dcfd","on-secondary-container":"#4b617d",
                        "surface":"#f7f9fc","on-surface":"#191c1e",
                        "surface-container-lowest":"#ffffff","surface-container-low":"#f2f4f7",
                        "on-surface-variant":"#414750","primary":"#005b9c","primary-container":"#2b74b9",
                        "tertiary":"#824c00","tertiary-fixed":"#ffdcbd",
                        "on-tertiary-container":"#fff5ee","outline-variant":"#c1c7d2",
                    },
                    fontFamily:{ headline:["Manrope"], body:["Inter"], label:["Inter"] }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; vertical-align:middle; }
        @keyframes fadeIn  { from{opacity:0;transform:scale(0.92)} to{opacity:1;transform:scale(1)} }
        @keyframes blink   { 0%,100%{opacity:1} 50%{opacity:0.2} }
        .animate-fadein    { animation:fadeIn 0.5s ease-out; }
        .animate-blink     { animation:blink 1.2s ease-in-out infinite; }
    </style>
</head>

<body class="bg-surface text-on-surface font-body h-screen overflow-hidden flex flex-col">

    <main class="flex-1 flex flex-row p-8 gap-8 overflow-hidden">
        <section class="flex-[1.2] flex flex-col gap-6">
            <div class="flex-1 bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(25,28,30,0.06)] flex flex-col items-center justify-center relative overflow-hidden">
                <div class="absolute top-8 left-8 flex items-center gap-3">
                    <div class="w-10 h-10 bg-primary rounded-full flex items-center justify-center">
                        <span class="material-symbols-outlined text-white text-xl">confirmation_number</span>
                    </div>
                    <span class="font-headline font-black text-primary text-2xl tracking-tighter">TurnoYa</span>
                </div>

                <div class="text-center px-8">
                    <span id="label-estado" class="block font-label text-secondary font-bold uppercase tracking-[0.2em] mb-3 text-lg">Esperando...</span>
                    <h1 id="turno-grande" class="font-headline font-extrabold text-primary leading-none tracking-tighter select-none text-[9rem]">---</h1>
                    <div class="flex items-center justify-center gap-3 mt-4">
                        <span id="puesto-grande" class="px-6 py-2 bg-secondary-container text-on-secondary-container rounded-full font-headline font-bold text-xl">---</span>
                        <span id="dot-estado" class="w-3 h-3 rounded-full hidden bg-green-500"></span>
                    </div>
                </div>
                <div class="absolute bottom-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-primary-container"></div>
            </div>

            <div class="bg-surface-container-lowest rounded-xl shadow-sm p-6">
                <div class="flex items-center gap-2 mb-4">
                    <span class="material-symbols-outlined text-primary text-xl">history</span>
                    <h3 class="font-headline font-extrabold text-on-surface text-lg">Últimos llamados</h3>
                </div>
                <div id="historial-lista" class="grid grid-cols-3 gap-3">
                    <p class="col-span-3 text-center text-outline text-sm py-3">Sin actividad</p>
                </div>
            </div>
        </section>

        <section class="flex-1 flex flex-col">
            <div class="bg-surface-container-low p-8 rounded-xl flex flex-col h-full">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="font-headline font-extrabold text-on-surface text-3xl tracking-tight">Próximos en espera</h2>
                    <span id="ws-status" class="text-[10px] bg-slate-100 text-slate-400 px-3 py-1 rounded-full font-bold uppercase">Iniciando...</span>
                </div>

                <div id="cola-espera" class="flex flex-col gap-4 flex-1 overflow-y-auto">
                    <div class="text-center text-outline py-10">
                        <span class="material-symbols-outlined text-5xl mb-3 block">group</span>
                        <p class="text-lg font-bold">No hay turnos en fila</p>
                    </div>
                </div>

                <div class="mt-6 bg-primary/5 rounded-lg p-5 flex items-center gap-4">
                    <div class="bg-white p-2 rounded-md">
                        <span class="material-symbols-outlined text-primary text-4xl">qr_code_2</span>
                    </div>
                    <div>
                        <p class="font-body font-bold text-primary text-lg">Escanea el QR</p>
                        <p class="text-on-surface-variant">para unirte a la fila</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-surface-container-lowest px-10 py-5 flex items-center justify-between shadow-sm z-10">
        <div class="flex items-center gap-10">
            <div class="flex items-baseline gap-2">
                <span id="reloj-hora" class="font-headline font-extrabold text-on-surface text-4xl">--:--</span>
                <span id="reloj-ampm" class="font-label font-bold text-outline text-lg uppercase">--</span>
            </div>
            <div class="h-8 w-[2px] bg-outline-variant"></div>
            <div>
                <span id="reloj-fecha" class="font-headline font-bold text-on-surface text-lg block">--</span>
                <span class="text-outline">Sede Central</span>
            </div>
        </div>
        <div class="flex-1 max-w-2xl px-10">
            <div class="flex items-center gap-3 bg-tertiary-fixed text-on-tertiary-container px-6 py-3 rounded-full">
                <span class="material-symbols-outlined text-tertiary">lightbulb</span>
                <p class="font-body font-semibold text-lg">Tip: Tené tu identificación a mano.</p>
            </div>
        </div>
    </footer>

    <script src="js/env.js"></script>
    <script>
        const API = window.__ENV__?.VITE_API_URL || 'https://turnoya-backend.onrender.com';
        let operadoresActivos = [];

        // --- RELOJ ---
        function actualizarReloj() {
            const ahora = new Date();
            let h = ahora.getHours();
            const m = String(ahora.getMinutes()).padStart(2,'0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12 || 12;
            document.getElementById('reloj-hora').innerText = `${h}:${m}`;
            document.getElementById('reloj-ampm').innerText = ampm;
            const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric' };
            document.getElementById('reloj-fecha').innerText = ahora.toLocaleDateString('es-AR', opts);
        }
        setInterval(actualizarReloj, 1000);
        actualizarReloj();

        // --- SINCRONIZACIÓN CON EL BACKEND ---
        // Usamos polling en lugar de WebSocket porque Render gratuito
        // no mantiene conexiones WS abiertas por más de unos segundos.
        // Cada 5 segundos consultamos el estado real de todos los operadores.
        async function sincronizarEstado() {
            try {
                let turnoPrincipal = null;
                let todosLosEnEspera = [];
                let todosLosAtendiendo = [];

                for (const op of operadoresActivos) {
                    // 1. Estado actual del puesto (llamando o atendiendo)
                    const resA = await fetch(`${API}/turnos/estado_actual/${op.id}`);
                    const atendiendo = await resA.json();

                    if (atendiendo && atendiendo.codigo) {
                        const tObj = { ...atendiendo, nombreOp: op.nombre };
                        todosLosAtendiendo.push(tObj);
                        // Priorizamos el turno en estado 'llamando' para mostrarlo grande
                        if (!turnoPrincipal || tObj.estado === 'llamando') {
                            turnoPrincipal = tObj;
                        }
                    }

                    // 2. Cola de espera del operador
                    const resC = await fetch(`${API}/turnos/cola/${op.id}`);
                    const cola = await resC.json();
                    if (Array.isArray(cola)) {
                        cola.forEach(t => todosLosEnEspera.push({ ...t, nombreOp: op.nombre }));
                    }
                }

                renderPantalla(turnoPrincipal, todosLosAtendiendo, todosLosEnEspera);
                setStatus(`${operadoresActivos.length} activos`, true);

            } catch (e) {
                console.error("Error sincronizando:", e);
                setStatus('Error de conexión', false);
            }
        }

        // --- RENDER ---
        function renderPantalla(principal, atendiendo, espera) {
            const tG = document.getElementById('turno-grande');
            const lE = document.getElementById('label-estado');
            const pG = document.getElementById('puesto-grande');
            const dot = document.getElementById('dot-estado');

            if (principal) {
                tG.innerText = principal.codigo;
                pG.innerText = principal.nombreOp;
                dot.classList.remove('hidden');
                tG.classList.remove('animate-blink');

                if (principal.estado === 'llamando') {
                    tG.style.color = '#f59e0b';
                    tG.classList.add('animate-blink');
                    lE.innerText = '🔔 Llamando...';
                    dot.className = 'w-3 h-3 rounded-full bg-amber-500 animate-pulse';
                } else {
                    tG.style.color = '#005b9c';
                    lE.innerText = '✂️ Atendiendo Ahora';
                    dot.className = 'w-3 h-3 rounded-full bg-green-500';
                }
            } else {
                tG.innerText = "---";
                pG.innerText = "---";
                lE.innerText = "Esperando...";
                dot.classList.add('hidden');
                tG.style.color = '';
                tG.classList.remove('animate-blink');
            }

            // Historial de turnos activos (llamando + atendiendo)
            const hLista = document.getElementById('historial-lista');
            if (atendiendo.length === 0) {
                hLista.innerHTML = '<p class="col-span-3 text-center text-outline text-sm py-3">Sin actividad</p>';
            } else {
                hLista.innerHTML = atendiendo.slice(0, 6).map(t => `
                    <div class="bg-surface-container-low rounded-xl p-3 text-center border-l-4 ${t.estado === 'llamando' ? 'border-amber-500' : 'border-green-500'}">
                        <p class="font-headline font-black text-primary text-lg">${t.codigo}</p>
                        <p class="text-[9px] text-outline uppercase font-bold truncate">${t.nombreOp}</p>
                    </div>
                `).join('');
            }

            // Cola de espera
            const cLista = document.getElementById('cola-espera');
            if (espera.length === 0) {
                cLista.innerHTML = '<div class="text-center text-outline py-10"><p class="text-lg font-bold">No hay turnos en fila</p></div>';
            } else {
                cLista.innerHTML = espera.map(t => `
                    <div class="bg-surface-container-lowest p-6 rounded-lg shadow-sm flex justify-between items-center animate-fadein">
                        <span class="font-headline font-bold text-primary text-2xl">${t.codigo}</span>
                        <div class="text-right"><span class="font-body text-secondary text-lg block">${t.nombreOp}</span></div>
                    </div>
                `).join('');
            }
        }

        // --- STATUS BADGE ---
        function setStatus(msg, ok) {
            const el = document.getElementById('ws-status');
            el.innerText = msg;
            el.className = `text-[10px] px-3 py-1 rounded-full font-bold uppercase ${ok ? 'bg-green-100 text-green-600' : 'bg-red-100 text-red-500'}`;
        }

        // --- INICIO ---
        async function iniciar() {
            try {
                // Cargamos los operadores activos del establecimiento
                const res = await fetch(`${API}/operadores/?establecimiento_id=1`);
                const todos = await res.json();
                operadoresActivos = todos.filter(op => op.activo && op.rol !== 'admin');

                if (operadoresActivos.length > 0) {
                    // Primera sincronización inmediata
                    await sincronizarEstado();
                    // Polling cada 5 segundos — reemplaza al WebSocket que Render no soporta en plan gratuito
                    setInterval(sincronizarEstado, 5000);
                } else {
                    setStatus('Sin operadores', false);
                }
            } catch (e) {
                setStatus('Error de conexión', false);
                // Reintentamos iniciar después de 5 segundos si falla
                setTimeout(iniciar, 5000);
            }
        }

        // Desbloqueamos el audio en el primer click del usuario
        // (los navegadores bloquean audio sin interacción previa)
        document.body.addEventListener('click', () => {
            const a = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            a.volume = 0; a.play().then(() => a.pause()).catch(()=>{});
        }, { once: true });

        iniciar();
    </script>

</body>
</html>
