<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurnoYa — Sacar turno</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <img src="assets/logo.png" alt="TurnoYa">
    </div>

    <div id="alert-container"></div>

    <div class="card">
      <div class="form-group">
        <label>DNI</label>
        <input type="number" id="dni" placeholder="Ingresá tu DNI">
      </div>
      <div class="form-group">
        <label>Nombre completo</label>
        <input type="text" id="nombre" placeholder="Juan García">
      </div>
      <div class="form-group">
        <label>Motivo de consulta</label>
        <select id="motivo">
          <option value="">Seleccioná el motivo</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btn-turno" onclick="sacarTurno()">
        Sacar turno
      </button>
    </div>

    <div style="text-align:center; margin-top: 12px;">
      <a href="login.html" style="font-size:13px; color:var(--text-muted); text-decoration:none;">
        Área empleados
      </a>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search)
    const operadorId = params.get('op')

    const motivos = ['Corte', 'Corte + Barba', 'Tintura', 'Barba', 'Corte Premium', 'Otro']
    const sel = document.getElementById('motivo')
    motivos.forEach(m => {
      const opt = document.createElement('option')
      opt.value = m
      opt.textContent = m
      sel.appendChild(opt)
    })

    function showAlert(msg, type = 'error') {
      document.getElementById('alert-container').innerHTML =
        `<div class="alert alert-${type}">${msg}</div>`
    }

    async function sacarTurno() {
      const dni = document.getElementById('dni').value.trim()
      const nombre = document.getElementById('nombre').value.trim()
      const motivo = document.getElementById('motivo').value

      if (!dni || !nombre || !motivo) return showAlert('Completá todos los campos')
      if (!operadorId) return showAlert('QR inválido — falta el operador')

      const btn = document.getElementById('btn-turno')
      btn.disabled = true
      btn.textContent = 'Procesando...'

      try {
        let pushToken = null
        if ('Notification' in window) {
          const perm = await Notification.requestPermission()
          if (perm === 'granted') pushToken = 'web-push-placeholder'
        }

        const turno = await api.crearTurno({
          dni_cliente: dni,
          nombre_cliente: nombre,
          motivo,
          operador_id: parseInt(operadorId),
          push_token: pushToken
        })

        localStorage.setItem('turno_id', turno.id)
        localStorage.setItem('operador_id', operadorId)
        window.location.href = `turno.html`

      } catch (e) {
        showAlert(e.message)
        btn.disabled = false
        btn.textContent = 'Sacar turno'
      }
    }
  </script>
</body>
</html>
