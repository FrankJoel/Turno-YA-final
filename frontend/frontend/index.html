<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>TurnoYa | Sacá tu turno</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#2B74B9",
            "primary-container": "#1E5A92",
            "surface": "#f7f9fc",
            "on-surface": "#191c1e",
            "surface-container-low": "#f2f4f7",
            "surface-container-lowest": "#ffffff",
          }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    body { font-family:'Inter', sans-serif; -webkit-font-smoothing:antialiased; }
    h1, h2, h3, .font-headline { font-family:'Manrope', sans-serif; }
  </style>
</head>

<body class="bg-surface text-on-surface min-h-screen flex flex-col">

  <header class="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
    <div class="flex justify-between items-center px-6 py-5 w-full max-w-screen-2xl mx-auto">
      <h1 class="font-headline text-lg font-black tracking-tight text-primary">TurnoYa</h1>
    </div>
  </header>

  <main class="flex-grow pt-28 pb-12 px-6 flex flex-col max-w-lg mx-auto w-full">

    <section class="mb-10 text-center">
      <div class="flex justify-center mb-4">
        <img alt="TurnoYa Logo" class="h-32 w-auto object-contain drop-shadow-xl"
             src="img/logo.jpg"
             onerror="this.src='https://ui-avatars.com/api/?name=Turno+Ya&background=2B74B9&color=fff&size=128'"/>
      </div>
      <h2 class="font-headline text-2xl font-extrabold text-slate-800">¡Hola!</h2>
      <p class="text-slate-500 font-medium">Registrate para obtener tu turno</p>
      <div id="puesto-badge" class="mt-2 inline-block bg-primary/10 text-primary text-[10px] font-bold px-3 py-1 rounded-full hidden">
        PUESTO DETECTADO
      </div>
      
      <div id="error-operador" class="hidden mt-3 bg-red-50 text-red-700 text-sm font-bold px-4 py-3 rounded-2xl border border-red-100">
        No se pudo encontrar el operador. Verificá el QR escaneado.
      </div>
    </section>

    <form id="form-registro-turno" class="space-y-5" autocomplete="off">
      <input type="hidden" id="puesto_input" name="puesto" value="1">

      <div class="bg-surface-container-lowest p-5 rounded-3xl shadow-sm border border-slate-100 focus-within:border-primary/50 transition-all">
        <label class="block text-[10px] font-black text-primary uppercase tracking-widest mb-3 ml-1" for="full_name">
          Nombre Completo
        </label>
        <div class="relative">
          <input class="w-full bg-surface-container-low border-none rounded-2xl py-4 px-6 text-on-surface focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all placeholder:text-slate-300 font-bold outline-none"
                 id="full_name" name="full_name" placeholder="Ej. Juan Pérez" type="text" required maxlength="60"/>
          <div class="absolute right-6 top-1/2 -translate-y-1/2 text-primary/30">
            <span class="material-symbols-outlined">person</span>
          </div>
        </div>
      </div>

      <div class="bg-surface-container-lowest p-5 rounded-3xl shadow-sm border border-slate-100 focus-within:border-primary/50 transition-all">
        <label class="block text-[10px] font-black text-primary uppercase tracking-widest mb-3 ml-1" for="dni">
          DNI / Documento
        </label>
        <div class="relative">
          <input class="w-full bg-surface-container-low border-none rounded-2xl py-4 px-6 text-on-surface focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all placeholder:text-slate-300 font-bold outline-none"
                 id="dni" name="dni" placeholder="12345678" type="text" inputmode="numeric" pattern="[0-9]{6,10}" required/>
          <div class="absolute right-6 top-1/2 -translate-y-1/2 text-primary/30">
            <span class="material-symbols-outlined">badge</span>
          </div>
        </div>
      </div>

      <div class="bg-surface-container-lowest p-5 rounded-3xl shadow-sm border border-slate-100 focus-within:border-primary/50 transition-all">
        <label class="block text-[10px] font-black text-primary uppercase tracking-widest mb-3 ml-1" for="reason">
          Motivo de Consulta
        </label>
        <div class="relative">
          <select class="w-full bg-surface-container-low border-none rounded-2xl py-4 pl-6 pr-12 text-on-surface !appearance-none focus:ring-2 focus:ring-primary/20 focus:bg-white transition-all font-bold cursor-pointer outline-none"
                  id="motivo" name="motivo" required>
            <option disabled selected value="">Cargando servicios...</option>
          </select>
          <div class="absolute right-6 top-1/2 -translate-y-1/2 text-primary/30 pointer-events-none">
            <span class="material-symbols-outlined">expand_more</span>
          </div>
        </div>
      </div>

      <div class="pt-6">
        <button type="submit" id="btn-sacar-turno"
                class="w-full bg-gradient-to-r from-primary to-primary-container text-white py-5 px-8 rounded-2xl font-headline font-black text-lg shadow-lg shadow-blue-500/30 active:scale-[0.98] transition-all flex items-center justify-center gap-3">
          Sacar Turno
          <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">confirmation_number</span>
        </button>
      </div>
    </form>

    <div class="mt-8 text-center">
      <a href="loginStaff.html" class="text-[11px] font-bold text-slate-400 hover:text-primary transition-colors uppercase tracking-widest">
        Área empleados
      </a>
    </div>

    <div class="mt-12 px-6 flex items-start gap-3 bg-amber-50/50 p-4 rounded-2xl border border-amber-100/50">
      <span class="material-symbols-outlined text-amber-500 text-sm mt-0.5">info</span>
      <p class="text-[10px] text-slate-500 leading-relaxed font-medium">
        Tus datos serán tratados de forma confidencial. Al sacar turno, aceptas nuestros <a href="#" class="text-primary underline">Términos de Servicio</a>.
      </p>
    </div>

  </main>

  <script type="module" src="js/registro-cliente.js"></script>
</body>
</html>
