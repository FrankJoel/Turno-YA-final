<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TurnoYa — Estadísticas</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="topbar">
    <a href="javascript:history.back()" style="color:#fff;font-size:20px;text-decoration:none;">←</a>
    <div class="logo-text">Turno<span>YA</span></div>
    <div style="width:32px;"></div>
  </div>

  <div class="container" style="padding-top:20px;">

    <div class="section-title">Métricas del día</div>
    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-val" id="stat-atendidos">—</div>
        <div class="stat-label">Atendidos</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-cancelados">—</div>
        <div class="stat-label">Cancelados</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-prom">—</div>
        <div class="stat-label">Prom. minutos</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="stat-ops">—</div>
        <div class="stat-label">Operadores activos</div>
      </div>
    </div>

    <div class="section-title">Motivos frecuentes</div>
    <div class="card">
      <div id="barras-motivos">
        <div class="spinner"></div>
      </div>
    </div>

    <div class="section-title">Rendimiento por operador</div>
    <div class="card" style="padding:0;overflow:hidden;">
      <table>
        <thead>
          <tr>
            <th>Operador</th>
            <th>Atendidos</th>
            <th>Prom.</th>
            <th>Estado</th>
          </tr>
        </thead>
        <tbody id="tabla-ops-stats">
          <tr><td colspan="4" style="text-align:center;padding:20px;"><div class="spinner"></div></td></tr>
        </tbody>
      </table>
    </div>

    <button class="btn btn-primary" onclick="descargarPDF()" style="margin-top:8px;">
      Descargar PDF
    </button>

  </div>

  <script src="js/api.js"></script>
  <script>
    const user = api.getUser()
    if (!user.operador_id) window.location.href = 'login.html'
    const establecimientoId = 1

    async function cargarEstadisticas() {
      try {
        const [hoy, operadores] = await Promise.all([
          api.getEstadisticasHoy(establecimientoId),
          api.getEstadisticasOperadores(establecimientoId)
        ])

        document.getElementById('stat-atendidos').textContent = hoy.atendidos
        document.getElementById('stat-cancelados').textContent = hoy.cancelados
        document.getElementById('stat-prom').textContent = hoy.promedio_minutos + ' min'
        document.getElementById('stat-ops').textContent =
          operadores.filter(o => o.fila_abierta).length

        const motivos = hoy.motivos || {}
        const total = Object.values(motivos).reduce((a, b) => a + b, 0)
        const barrasEl = document.getElementById('barras-motivos')

        if (total === 0) {
          barrasEl.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">Sin datos aún</p>'
        } else {
          barrasEl.innerHTML = Object.entries(motivos)
            .sort((a, b) => b[1] - a[1])
            .map(([motivo, count]) => {
              const pct = Math.round((count / total) * 100)
              return `
                <div class="bar-row">
                  <div class="bar-label">${motivo}</div>
                  <div class="bar-track">
                    <div class="bar-fill" style="width:${pct}%"></div>
                  </div>
                  <div class="bar-val">${pct}%</div>
                </div>`
            }).join('')
        }

        const badge = (op) => op.fila_abierta
          ? '<span class="badge badge-green">Activo</span>'
          : '<span class="badge badge-amber">Cerrada</span>'

        document.getElementById('tabla-ops-stats').innerHTML =
          operadores.map(op => `
            <tr>
              <td>${op.operador}</td>
              <td>${op.atendidos}</td>
              <td>${op.promedio_minutos} min</td>
              <td>${badge(op)}</td>
            </tr>
          `).join('') || '<tr><td colspan="4" style="text-align:center;padding:16px;">Sin datos</td></tr>'

      } catch (e) { console.error(e) }
    }

    function descargarPDF() {
      alert('Función de PDF disponible próximamente')
    }

    cargarEstadisticas()
  </script>
</body>
</html>
