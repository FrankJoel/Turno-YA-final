<!DOCTYPE html>
<html class="light" lang="es">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Staff Login | TurnoYa</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container-lowest": "#ffffff",
            "surface-container-highest": "#e0e3e6",
            "surface-container-high": "#e6e8eb",
            "on-surface": "#191c1e",
            "on-surface-variant": "#414750",
            "outline": "#717782",
            "primary": "#005b9c",
            "primary-container": "#2b74b9",
            "on-primary": "#ffffff",
            "surface": "#f7f9fc",
          },
          borderRadius: { DEFAULT:"1rem", lg:"2rem", xl:"3rem", full:"9999px" },
          fontFamily: { headline:["Manrope"], body:["Inter"], label:["Inter"] }
        }
      }
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    body { font-family:'Inter', sans-serif; }
    h1, h2, h3 { font-family:'Manrope', sans-serif; }
  </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-4">

  <div class="mb-8 flex flex-col items-center gap-2">
    <div class="p-4 bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(25,28,30,0.06)]">
      <img src="img/logo.jpg" alt="TurnoYa"
           class="w-16 h-16 object-cover rounded-lg"
           onerror="this.src='https://ui-avatars.com/api/?name=TY&background=005b9c&color=fff&size=64'"/>
    </div>
    <div class="text-center">
      <h1 class="text-3xl font-black tracking-tight text-primary">TurnoYa</h1>
      <p class="text-on-surface-variant font-medium tracking-wide text-xs uppercase">Área de Staff</p>
    </div>
  </div>

  <main class="w-full max-w-md">
    <div class="bg-surface-container-lowest rounded-lg shadow-[0_20px_40px_rgba(25,28,30,0.06)] overflow-hidden">
      <div class="p-8 md:p-10">
        <h2 class="text-2xl font-extrabold text-on-surface tracking-tight mb-8 text-center">Bienvenido de nuevo</h2>

        <form class="space-y-6">

          <div class="space-y-2">
            <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant ml-2">Usuario</label>
            <div class="relative group">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">person</span>
              <input id="username-field" type="text" placeholder="ej: juangarcia"
                     class="w-full pl-12 pr-6 py-4 bg-surface-container-highest border-none rounded-full focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline outline-none"/>
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center px-2">
              <label class="text-xs font-bold uppercase tracking-widest text-on-surface-variant">Contraseña</label>
            </div>
            <div class="relative group">
              <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>
              <input type="password" placeholder="••••••••"
                     class="w-full pl-12 pr-12 py-4 bg-surface-container-highest border-none rounded-full focus:ring-2 focus:ring-primary focus:bg-surface-container-lowest transition-all placeholder:text-outline outline-none"/>
              <button type="button" class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary">
                <span class="material-symbols-outlined">visibility</span>
              </button>
            </div>
          </div>

          <button type="submit"
                  class="w-full py-4 px-8 bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-full font-bold text-lg shadow-lg hover:shadow-xl active:scale-95 transition-all duration-200 flex items-center justify-center gap-2">
            Iniciar sesión <span class="material-symbols-outlined">arrow_forward</span>
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer class="w-full py-8 text-center mt-auto">
    <p class="text-sm text-on-surface/40">© 2025 TurnoYa. Todos los derechos reservados.</p>
  </footer>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
